
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020617">
<title>Smart Pharmacy Wallet</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">

<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
navigator.serviceWorker.register('./sw.js');
});
}

let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
e.preventDefault();
deferredPrompt = e;
document.getElementById('installBtn').style.display='block';
});

async function installApp(){
if(deferredPrompt){
deferredPrompt.prompt();
await deferredPrompt.userChoice;
}
}
</script>

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:white;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo img{
width:60px;
height:60px;
border-radius:18px;
}

.title{
font-size:28px;
font-weight:bold;
background:linear-gradient(90deg,#38bdf8,#22c55e);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.card{
background:#0f172a;
padding:20px;
border-radius:22px;
margin-top:20px;
border:1px solid #1e293b;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:12px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
}

button{
padding:12px 18px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#06b6d4,#22c55e);
color:white;
font-weight:bold;
cursor:pointer;
}

.install{
display:none;
background:linear-gradient(90deg,#2563eb,#06b6d4);
}

.wallets{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:15px;
}

.wallet{
background:#111827;
padding:18px;
border-radius:18px;
}

.wallet h3{
margin:0 0 10px 0;
}

.wallet p{
font-size:28px;
font-weight:bold;
margin:0;
}

.progress{
height:26px;
background:#1e293b;
border-radius:50px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#06b6d4);
transition:0.4s;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:10px;
border-bottom:1px solid #334155;
text-align:center;
}

th{
background:#1e293b;
}

@media(max-width:600px){
.title{
font-size:22px;
}
}
</style>
</head>
<body>

<div class="header">
<div class="logo">
<img src="logo.png">
<div class="title">Smart Pharmacy Wallet</div>
</div>

<button class="install" id="installBtn" onclick="installApp()">📲 Install App</button>
</div>

<div class="card">
<h2>🎯 Installment Progress</h2>
<div id="progressText">0%</div>
<div class="progress">
<div class="fill" id="fill"></div>
</div>
</div>

<div class="card">
<h2>➕ Daily Entry</h2>

<input type="number" id="amount" placeholder="আজ হাতে থাকা টাকা">

<button onclick="saveEntry()">Save Entry</button>
</div>

<div class="card">
<h2>💰 Wallet Balances</h2>

<div class="wallets">
<div class="wallet">
<h3>Installment</h3>
<p id="installment">৳0</p>
</div>

<div class="wallet">
<h3>Personal</h3>
<p id="personal">৳0</p>
</div>

<div class="wallet">
<h3>Medicine</h3>
<p id="medicine">৳0</p>
</div>
</div>
</div>

<div class="card">
<h2>📜 History</h2>

<table>
<thead>
<tr>
<th>Date</th>
<th>Total</th>
<th>Installment</th>
<th>Personal</th>
<th>Medicine</th>
</tr>
</thead>

<tbody id="history"></tbody>
</table>
</div>

<script>
let data = JSON.parse(localStorage.getItem('smart_wallet')) || {
installment:0,
personal:0,
medicine:0,
history:[]
};

function saveEntry(){
const amount = Number(document.getElementById('amount').value);

if(!amount) return;

const installment = Math.round(amount*0.5);
const personal = Math.round(amount*0.2);
const medicine = Math.round(amount*0.3);

data.installment += installment;
data.personal += personal;
data.medicine += medicine;

data.history.push({
date:new Date().toLocaleDateString(),
amount,
installment,
personal,
medicine
});

localStorage.setItem('smart_wallet', JSON.stringify(data));

render();
document.getElementById('amount').value='';
}

function render(){
document.getElementById('installment').innerText='৳'+data.installment.toLocaleString();
document.getElementById('personal').innerText='৳'+data.personal.toLocaleString();
document.getElementById('medicine').innerText='৳'+data.medicine.toLocaleString();

const target = 50000;
const percent = Math.min((data.installment/target)*100,100);

document.getElementById('fill').style.width=percent+'%';
document.getElementById('progressText').innerText=
'Paid: ৳'+data.installment.toLocaleString()+' | Remaining: ৳'+Math.max(target-data.installment,0).toLocaleString();

const tbody=document.getElementById('history');
tbody.innerHTML='';

data.history.slice().reverse().forEach(h=>{
tbody.innerHTML += `
<tr>
<td>${h.date}</td>
<td>৳${h.amount}</td>
<td>৳${h.installment}</td>
<td>৳${h.personal}</td>
<td>৳${h.medicine}</td>
</tr>
`;
});
}

render();
</script>

</body>
</html>
